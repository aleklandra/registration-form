<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма регистрации — учебный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>Регистрация</h1>
    <form id="signupForm" method="post" novalidate>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="text" id="phone" name="phone" placeholder="+79991234567" aria-describedby="phoneError">
        <span class="error" id="phoneError" aria-live="polite" aria-atomic="true"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Минимум 8 символов" aria-describedby="passwordError">
        <div class="strength-meter">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <span class="strength-label" id="strengthLabel"></span>
        <span class="error" id="passwordError" aria-live="polite" aria-atomic="true"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Повторите пароль</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" aria-describedby="confirmError">
        <span class="error" id="confirmError" aria-live="polite" aria-atomic="true"></span>
      </div>

      <button type="submit" id="submitBtn" disabled>Зарегистрироваться</button>
    </form>
    <div class="success" id="successMessage" role="status" hidden></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
